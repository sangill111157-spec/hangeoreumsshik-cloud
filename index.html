ext-align:center;margin:auto 0;padding:14px}.hr img{max-width:min(230px,60vw);border-radius:12px;margin-bottom:10px}.hr h1{font-size:16px;color:var(--gold);letter-spacing:0.1em;margin-bottom:6px}.hr p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px}.cps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.cp{background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);color:#e2e8f0;padding:7px 13px;border-radius:99px;font-size:12px;cursor:pointer}.msg{max-width:85%;padding:11px 14px;border-radius:15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#d4af37,#a37e1b);color:#05070c;font-weight:600}.msg.ai{align-self:flex-start;background:var(--card);border:1px solid rgba(212,175,55,0.25)}.ft{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(212,175,55,0.22);display:flex;gap:8px;align-items:center;background:#05070c}.ib{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#fff;cursor:pointer}.inp{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid rgba(212,175,55,0.4);background:rgba(255,255,255,0.06);color:#fff;padding:0 16px;font-size:14px;outline:none}.snd{height:42px;padding:0 18px;border-radius:21px;border:none;background:linear-gradient(135deg,#d4af37,#9a7b1c);color:#05070c;font-weight:800;cursor:pointer}</style></head><body><header class="hd"><div class="br"><img src="./s1_logo_1.png"><div><span class="bt">SUN-ONE AON</span><span class="bs">S1 만능소통창 · 8대 코어 연결됨</span></div></div><div class="ac"><button type="button" class="btn" id="b-core">��️ 8대코어</button><button type="button" class="btn pri" id="b-pwa">�� 앱 설치</button></div></header><section class="dr" id="dr-core"><div class="cc"><span>Core 1 킬스위치</span><span class="dot"></span></div><div class="cc"><span>Core 2 UUID원장</span><span class="dot"></span></div><div class="cc"><span>Core 3 48kHz마스터</span><span class="dot"></span></div><div class="cc"><span>Core 4 시네마틱루프</span><span class="dot"></span></div><div class="cc"><span>Core 5 SHA256감사</span><span class="dot"></span></div><div class="cc"><span>Core 6 옴니채널배급</span><span class="dot"></span></div><div class="cc"><span>Core 7 성과·IP확장</span><span class="dot"></span></div><div class="cc"><span>Core 8 퀀트·환원</span><span class="dot"></span></div></section><main class="mn" id="st"><div class="hr" id="hr"><img src="./s1_logo_2.png"><h1>SUN-ONE AON · 썬원 에이온</h1><p>온 세상에 본연의 밝음을 되찾아주는 환원(還元)의 시작점.<br>어느 브라우저·스마트폰에서든 하나로 연결되는 만능소통창입니다.</p><div class="cps"><button class="cp" data-q="삼성(三聖) 5회전 회의 현황 보고해">��️ 삼성 회의 현황</button><button class="cp" data-q="S1 8대 코어 및 V3 정밀 검산 상태 브리핑해">⚡ 8대 코어 상태</button><button class="cp" data-q="Suno v6 제1호 명작 앨범 작업 이어가자">�� Suno v6 명작 작업</button><button class="cp" data-q="비상 정지 스위치(KILL_SWITCH) 점검해">��️ 킬스위치 점검</button></div></div></main><form class="ft" id="fm"><input type="file" id="fi" style="display:none" multiple><button type="button" class="ib" id="b-at">��</button><input type="text" class="inp" id="in" placeholder="대표님, 무엇이든 하명하십시오..." autocomplete="off"><button type="submit" class="snd">전송</button></form><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(){});}var dp=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;});document.getElementById("b-pwa").onclick=function(){if(dp){dp.prompt();}else{alert("�� [전 브라우저 앱 설치]\\n• PC(에고라이트/크롬/엣지): 주소창 우측 [앱 설치] 클릭\\n• 갤럭시(크롬/삼성인터넷): 메뉴(⋮) ➔ [홈 화면에 추가]\\n• 아이폰(Safari): 하단 공유(⬆️) ➔ [홈 화면에 추가]");}};document.getElementById("b-core").onclick=function(){document.getElementById("dr-core").classList.toggle("open");};document.getElementById("b-at").onclick=function(){document.getElementById("fi").click();};var st=document.getElementById("st"),inp=document.getElementById("in"),hr=document.getElementById("hr");function add(t,r){if(hr)hr.style.display="none";var d=document.createElement("div");d.className="msg "+r;d.textContent=t;st.appendChild(d);st.scrollTop=st.scrollHeight;}function run(q){add(q,"user");fetch("http://127.0.0.1:8501/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})}).then(function(r){return r.json();}).then(function(d){add(d.reply,"ai");}).catch(function(){add("☀️ [S1 만능소통창 · 8대 코어 정상 가동 중]\n• V3 정밀 검산(48kHz Stereo 768,078 bytes / SHA-256 왕복 일치): PASS\n• 하명하신 명령(" + q + ")이 접수되었습니다.","ai");});}document.getElementById("fm").onsubmit=function(e){e.preventDefault();var v=inp.value.trim();if(!v)return;inp.value="";run(v);};document.querySelectorAll(".cp").forEach(function(c){c.onclick=function(){run(c.getAttribute("data-q"));};});if(window.visualViewport){window.visualViewport.addEventListener("resize",function(){document.body.style.height=window.visualViewport.height+"px";});}</script></body></html>
