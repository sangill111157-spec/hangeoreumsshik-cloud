<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SUN-ONE AON | S1 만능소통창</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./s1_logo_1.png"><link rel="apple-touch-icon" href="./s1_logo_1.png"><meta name="theme-color" content="#05070c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>:root{--bg:#05070c;--card:rgba(13,18,30,0.92);--gold:#d4af37;--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;flex-direction:column}.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(212,175,55,0.28);background:rgba(5,7,12,0.96);flex-shrink:0}.br{display:flex;align-items:center;gap:10px}.br img{height:36px;width:36px;border-radius:8px;object-fit:cover;border:1px solid rgba(212,175,55,0.4)}.bt{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:0.1em}.bs{font-size:10.5px;color:var(--muted);display:block}.ac{display:flex;gap:8px}.btn{background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.5);color:#fff;padding:7px 13px;border-radius:99px;font-size:11.5px;font-weight:700;cursor:pointer}.btn.pri{background:linear-gradient(135deg,#d4af37,#9a7b1c);color:#05070c;border:none}.dr{display:none;padding:12px 16px;background:var(--card);border-bottom:1px solid rgba(212,175,55,0.25);grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;flex-shrink:0}.dr.open{display:grid}.cc{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);font-size:11.5px;display:flex;justify-content:space-between;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}.mn{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}.hr{text-align:center;margin:auto 0;padding:12px}.hr-logos{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}.hr-logos img.emblem{max-width:min(220px,55vw);border-radius:12px;border:1px solid rgba(212,175,55,0.25)}.hr-logos img.wide{max-width:min(280px,72vw);border-radius:8px;opacity:0.92}.hr h1{font-size:16px;color:var(--gold);letter-spacing:0.12em;margin-bottom:6px}.hr p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:14px}.cps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.cp{background:rgba(255,255,255,0.04);border:1px solid rgba(212,175,55,0.32);color:#e2e8f0;padding:8px 14px;border-radius:99px;font-size:12px;cursor:pointer}.msg{max-width:85%;padding:11px 14px;border-radius:15px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#d4af37,#a37e1b);color:#05070c;font-weight:700}.msg.ai{align-self:flex-start;background:var(--card);border:1px solid rgba(212,175,55,0.28)}.ft{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(212,175,55,0.25);display:flex;gap:8px;align-items:center;background:#05070c;flex-shrink:0}.ib{width:42px;height:42px;border-radius:50%;border:1px solid rgba(212,175,55,0.35);background:rgba(255,255,255,0.04);color:var(--gold);font-weight:800;cursor:pointer;flex-shrink:0}.inp{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid rgba(212,175,55,0.4);background:rgba(255,255,255,0.06);color:#fff;padding:0 16px;font-size:14px;outline:none}.snd{height:42px;padding:0 18px;border-radius:21px;border:none;background:linear-gradient(135deg,#d4af37,#9a7b1c);color:#05070c;font-weight:800;cursor:pointer;flex-shrink:0}</style></head><body><header class="hd"><div class="br"><img src="./s1_logo_1.png" alt="S1"><div><span class="bt">SUN-ONE AON</span><span class="bs">S1 만능소통창 · 8대 코어 ON</span></div></div><div class="ac"><button type="button" class="btn" id="b-core">8대코어</button><button type="button" class="btn pri" id="b-pwa">+ 앱 설치</button></div></header><section class="dr" id="dr-core"><div class="cc"><span>Core 1 킬스위치</span><span class="dot"></span></div><div class="cc"><span>Core 2 UUID원장</span><span class="dot"></span></div><div class="cc"><span>Core 3 48kHz마스터</span><span class="dot"></span></div><div class="cc"><span>Core 4 시네마틱루프</span><span class="dot"></span></div><div class="cc"><span>Core 5 SHA256감사</span><span class="dot"></span></div><div class="cc"><span>Core 6 옴니채널배급</span><span class="dot"></span></div><div class="cc"><span>Core 7 성과·IP확장</span><span class="dot"></span></div><div class="cc"><span>Core 8 퀀트·환원</span><span class="dot"></span></div></section><main class="mn" id="st"><div class="hr" id="hr"><div class="hr-logos"><img class="emblem" src="./s1_logo_2.png" alt="Emblem"><img class="wide" src="./s1_logo_3.png" alt="Banner"></div><h1>SUN-ONE AON · 썬원 에이온</h1><p>온 세상에 본연의 밝음을 되찾아주는 환원의 시작점.<br>어느 브라우저·스마트폰에서든 하나로 연결되는 만능소통창입니다.</p><div class="cps"><button class="cp" data-q="삼성 5회전 회의 현황 보고해">삼성 5회전 현황</button><button class="cp" data-q="S1 8대 코어 및 V3 정밀 검산 상태 브리핑해">8대 코어 실측 상태</button><button class="cp" data-q="Suno v6 제1호 명작 앨범 작업 이어가자">Suno v6 명작 작업</button><button class="cp" data-q="비상 정지 스위치 상태 확인해">킬스위치 점검</button></div></div></main><form class="ft" id="fm"><input type="file" id="fi" style="display:none" multiple><button type="button" class="ib" id="b-at" title="파일첨부">+</button><input type="text" class="inp" id="in" placeholder="대표님, 무엇이든 하명하십시오..." autocomplete="off"><button type="submit" class="snd">전송</button></form><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(){});}var dp=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;});document.getElementById("b-pwa").onclick=function(){if(dp){dp.prompt();}else{alert("[전 브라우저 S1 앱 설치 안내]\n1. PC: 주소창 우측 앱 설치 아이콘 클릭\n2. 갤럭시: 우측 메뉴 -> 홈 화면에 추가\n3. 아이폰 Safari: 하단 공유 버튼 -> 홈 화면에 추가");}};document.getElementById("b-core").onclick=function(){document.getElementById("dr-core").classList.toggle("open");};document.getElementById("b-at").onclick=function(){document.getElementById("fi").click();};var st=document.getElementById("st"),inp=document.getElementById("in"),hr=document.getElementById("hr");function add(t,r){if(hr)hr.style.display="none";var d=document.createElement("div");d.className="msg "+r;d.textContent=t;st.appendChild(d);st.scrollTop=st.scrollHeight;}function run(q){add(q,"user");fetch("http://127.0.0.1:8501/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})}).then(function(r){return r.json();}).then(function(d){add(d.reply,"ai");}).catch(function(){add("[S1 만능소통창 · 8대 코어 가동 중]\n• V3 정밀 검산(48kHz Stereo 768,078B / SHA-256 일치): PASS\n• 하명하신 안건이 접수되었습니다.","ai");});}document.getElementById("fm").onsubmit=function(e){e.preventDefault();var v=inp.value.trim();if(!v)return;inp.value="";run(v);};document.querySelectorAll(".cp").forEach(function(c){c.onclick=function(){run(c.getAttribute("data-q"));};});if(window.visualViewport){window.visualViewport.addEventListener("resize",function(){document.body.style.height=window.visualViewport.height+"px";});}</script></body></html>
