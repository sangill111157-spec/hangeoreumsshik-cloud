<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클로드 오퍼스 5.5 모션 그래픽 스튜디오 | 제35기관</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(99, 102, 241, 0.25);
      --primary: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      margin-bottom: 14px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }
    .status-pill {
      font-size: 12px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .preset-selector {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .preset-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preset-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      color: #fff;
      border-color: var(--primary);
    }
    .preset-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(6, 182, 212, 0.3));
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .canvas-wrapper {
      position: relative;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      max-height: 480px;
      max-width: 100%;
      object-fit: contain;
    }
    .storyboard-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 600;
      border: 1px solid rgba(6, 182, 212, 0.3);
      pointer-events: none;
    }

    .controls-panel {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-cyan);
      min-width: 65px;
      font-variant-numeric: tabular-nums;
    }
    .slider {
      flex: 1;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-record {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .btn-record:hover {
      background: rgba(239, 68, 68, 0.35);
    }
    .btn-record.recording {
      background: #ef4444;
      color: #fff;
      animation: pulse 1s infinite;
    }
    .btn-secondary {
      background: rgba(51, 65, 85, 0.6);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.8);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-group">
      <span class="badge">제35기관</span>
      <span class="header-title">클로드 오퍼스 5.5 모션 그래픽 스튜디오</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span id="canvas-spec">9:16 Shorts (1080×1920)</span>
    </div>
  </div>

  <div class="main-container">
    <!-- 프리셋 선택기 -->
    <div class="preset-selector">
      <button class="preset-btn active" id="btn-preset-shorts" onclick="setPreset('hangeoreum_shorts')">
        🎬 한걸음 쇼츠 (9:16)
      </button>
      <button class="preset-btn" id="btn-preset-nvda" onclick="setPreset('nvda_chart_motion')">
        📈 NVDA 차트 (16:9)
      </button>
      <button class="preset-btn" id="btn-preset-aon" onclick="setPreset('haesang_aon_mv')">
        🪐 아온 우주뮤비 (9:16)
      </button>
    </div>

    <!-- 캔버스 영역 -->
    <div class="canvas-wrapper" id="canvas-container">
      <canvas id="motion-canvas" width="1080" height="1920"></canvas>
      <div class="storyboard-overlay" id="storyboard-phase">Hook (0~2s): 타이포 임팩트</div>
    </div>

    <!-- 컨트롤러 패널 -->
    <div class="controls-panel">
      <div class="timeline-row">
        <span class="time-label" id="time-display">0.00s / 10.0s</span>
        <input type="range" id="time-slider" class="slider" min="0" max="10" step="0.033" value="0" oninput="onSliderChange(this.value)">
      </div>

      <div class="action-row">
        <div class="btn-group">
          <button class="btn btn-primary" id="btn-play" onclick="togglePlay()">
            ▶ 재생
          </button>
          <button class="btn btn-secondary" onclick="resetPlay()">
            ⏮ 처음으로
          </button>
        </div>

        <div class="btn-group">
          <button class="btn btn-record" id="btn-record" onclick="toggleRecord()">
            🔴 WebM 영상 녹화
          </button>
          <button class="btn btn-secondary" onclick="exportFramePNG()">
            📸 프레임 캡처
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 제35기관 결정론적 Canvas 모션 그래픽 스튜디오 (window.seek(t) 지원)
    // =========================================================================
    const canvas = document.getElementById('motion-canvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('time-display');
    const timeSlider = document.getElementById('time-slider');
    const phaseOverlay = document.getElementById('storyboard-phase');
    const btnPlay = document.getElementById('btn-play');
    const btnRecord = document.getElementById('btn-record');
    const specLabel = document.getElementById('canvas-spec');

    let currentPreset = 'hangeoreum_shorts';
    let currentTime = 0;
    const TOTAL_DURATION = 10.0; // 10초 풀 모션
    let isPlaying = false;
    let animFrameId = null;
    let lastTimestamp = null;

    // 녹화 관련
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Easing Helpers
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function easeInOutQuad(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    // =========================================================================
    // 프리셋 설정 및 해상도 전환
    // =========================================================================
    function setPreset(name) {
      currentPreset = name;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      
      if (name === 'nvda_chart_motion') {
        document.getElementById('btn-preset-nvda').classList.add('active');
        canvas.width = 1920;
        canvas.height = 1080;
        specLabel.textContent = '16:9 Landscape (1920×1080)';
      } else {
        canvas.width = 1080;
        canvas.height = 1920;
        if (name === 'haesang_aon_mv') {
          document.getElementById('btn-preset-aon').classList.add('active');
          specLabel.textContent = '9:16 우주뮤비 (1080×1920)';
        } else {
          document.getElementById('btn-preset-shorts').classList.add('active');
          specLabel.textContent = '9:16 Shorts (1080×1920)';
        }
      }
      seek(currentTime);
    }

    // =========================================================================
    // 4단 스토리보드 결정론적 렌더러 (window.seek(t))
    // Hook (0~2s) -> Story (2~5s) -> Data Count-up Chart (5~8s) -> Logo CTA (8~10s)
    // =========================================================================
    window.seek = function(t) {
      currentTime = clamp(t, 0, TOTAL_DURATION);
      timeSlider.value = currentTime;
      timeDisplay.textContent = `${currentTime.toFixed(2)}s / 10.0s`;

      const W = canvas.width;
      const H = canvas.height;

      // 배경 클리어
      ctx.fillStyle = '#0a0e1a';
      ctx.fillRect(0, 0, W, H);

      // 스토리보드 단계 파악
      let phaseText = '';
      if (currentTime < 2.0) {
        phaseText = 'Hook (0~2s): 강렬한 임팩트 키네틱 타이포';
      } else if (currentTime < 5.0) {
        phaseText = 'Story (2~5s): 핵심 맥락 & 스토리 전개';
      } else if (currentTime < 8.0) {
        phaseText = 'Data Count-up Chart (5~8s): 실시간 차트 & 카운트업';
      } else {
        phaseText = 'Logo CTA (8~10s): 로고 펄스 & 구독 액션';
      }
      phaseOverlay.textContent = phaseText;

      if (currentPreset === 'hangeoreum_shorts') {
        renderShorts(currentTime, W, H);
      } else if (currentPreset === 'nvda_chart_motion') {
        renderNvda(currentTime, W, H);
      } else {
        renderAonMv(currentTime, W, H);
      }
    };

    // -------------------------------------------------------------------------
    // 프리셋 1: 한걸음 쇼츠 (9:16)
    // -------------------------------------------------------------------------
    function renderShorts(t, W, H) {
      // 은은한 배경 그리드 & 네온 오라
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.12)';
      ctx.lineWidth = 2;
      for (let y = 0; y < H; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // 1. Hook (0~2s)
      if (t < 2.0) {
        const p = t / 2.0;
        const scale = 0.6 + easeOutCubic(p) * 0.4;
        ctx.save();
        ctx.translate(W / 2, H / 2 - 100);
        ctx.scale(scale, scale);
        ctx.fillStyle = '#fff';
        ctx.font = '900 78px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(6, 182, 212, 0.8)';
        ctx.shadowBlur = 40;
        ctx.fillText('한걸음씩 클라우드', 0, 0);

        ctx.fillStyle = '#06b6d4';
        ctx.font = '700 42px Pretendard, sans-serif';
        ctx.fillText('⚡ 자율 사령부 전격 가동 ⚡', 0, 80);
        ctx.restore();
      }
      // 2. Story (2~5s)
      else if (t < 5.0) {
        const p = (t - 2.0) / 3.0;
        ctx.save();
        ctx.fillStyle = '#f8fafc';
        ctx.font = '800 64px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('35대 기관 무결점 연동', W / 2, H / 2 - 200);

        // 35개 기관 아이콘 파티클 원형 배치
        const count = 16;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + p * Math.PI;
          const r = 240 + Math.sin(p * 5 + i) * 20;
          const px = W / 2 + Math.cos(angle) * r;
          const py = H / 2 + Math.sin(angle) * r;
          ctx.beginPath();
          ctx.arc(px, py, 14, 0, Math.PI * 2);
          ctx.fillStyle = i % 2 === 0 ? '#6366f1' : '#06b6d4';
          ctx.shadowColor = '#6366f1';
          ctx.shadowBlur = 15;
          ctx.fill();
        }

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 36px Pretendard, sans-serif';
        ctx.fillText('55개 스킬 풀파워 가동 중', W / 2, H / 2 + 320);
        ctx.restore();
      }
      // 3. Data Count-up Chart (5~8s)
      else if (t < 8.0) {
        const p = (t - 5.0) / 3.0;
        const currentCount = Math.floor(easeOutCubic(p) * 128400);

        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 36px Pretendard, sans-serif';
        ctx.fillText('유튜브 실시간 구독자 수', W / 2, H / 2 - 250);

        ctx.fillStyle = '#10b981';
        ctx.font = '900 96px Pretendard, sans-serif';
        ctx.shadowColor = 'rgba(16, 185, 129, 0.7)';
        ctx.shadowBlur = 30;
        ctx.fillText(`${currentCount.toLocaleString()} 명`, W / 2, H / 2 - 130);

        // 카운트업 바 차트
        const barWidth = 700;
        const barHeight = 36;
        const barX = (W - barWidth) / 2;
        const barY = H / 2;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.roundRect(barX, barY, barWidth, barHeight, 18);
        ctx.fill();

        ctx.fillStyle = 'linear-gradient(90deg, #10b981, #06b6d4)';
        ctx.beginPath();
        ctx.roundRect(barX, barY, barWidth * easeOutCubic(p), barHeight, 18);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 40px Pretendard, sans-serif';
        ctx.fillText(`달성률 ${Math.floor(p * 100)}% 🚀`, W / 2, H / 2 + 100);
        ctx.restore();
      }
      // 4. Logo CTA (8~10s)
      else {
        const p = (t - 8.0) / 2.0;
        const pulse = 1.0 + Math.sin(p * Math.PI * 4) * 0.05;
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.scale(pulse, pulse);

        // CTA 버튼
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 35;
        ctx.beginPath();
        ctx.roundRect(-260, -60, 520, 120, 60);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '900 46px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🔔 구독 & 알림설정', 0, 16);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 32px Pretendard, sans-serif';
        ctx.fillText('한걸음씩 클라우드와 함께 성장하세요', 0, 140);
        ctx.restore();
      }
    }

    // -------------------------------------------------------------------------
    // 프리셋 2: NVDA 차트 모션 (16:9)
    // -------------------------------------------------------------------------
    function renderNvda(t, W, H) {
      // 1. Hook (0~2s)
      if (t < 2.0) {
        const p = t / 2.0;
        ctx.save();
        ctx.fillStyle = '#76b900'; // NVIDIA Green
        ctx.font = '900 72px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#76b900';
        ctx.shadowBlur = 40;
        ctx.fillText('NVIDIA (NVDA) 실시간 퀀트 시그널', W / 2, H / 2 - 40);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 36px Pretendard, sans-serif';
        ctx.fillText('AI 오토트레이딩 제35기관 알파 엔진', W / 2, H / 2 + 40);
        ctx.restore();
      }
      // 2. Story (2~5s)
      else if (t < 5.0) {
        ctx.save();
        ctx.fillStyle = '#f8fafc';
        ctx.font = '800 52px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('초고속 데이터 피드 & 매수 모멘텀 감지', W / 2, 180);

        // 매수 시그널 그리드
        ctx.fillStyle = 'rgba(118, 185, 0, 0.15)';
        ctx.strokeStyle = '#76b900';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(W / 2 - 350, 260, 700, 400, 20);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#76b900';
        ctx.font = '900 64px Pretendard, sans-serif';
        ctx.fillText('STRONG BUY 🔥', W / 2, 420);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 32px Pretendard, sans-serif';
        ctx.fillText('알고리즘 신뢰도 99.4%', W / 2, 520);
        ctx.restore();
      }
      // 3. Data Count-up Chart (5~8s)
      else if (t < 8.0) {
        const p = (t - 5.0) / 3.0;
        const currentPrice = (120.0 + easeOutCubic(p) * 28.5).toFixed(2);

        ctx.save();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 28px Pretendard, sans-serif';
        ctx.fillText('NVDA 실시간 체결가', 160, 180);

        ctx.fillStyle = '#76b900';
        ctx.font = '900 84px Pretendard, sans-serif';
        ctx.shadowColor = '#76b900';
        ctx.shadowBlur = 25;
        ctx.fillText(`$${currentPrice}`, 160, 270);

        ctx.fillStyle = '#10b981';
        ctx.font = '700 34px Pretendard, sans-serif';
        ctx.fillText(`▲ +18.42% (+$${(currentPrice - 120).toFixed(2)})`, 160, 330);

        // 우측 라인 차트 드로잉
        const startX = 750;
        const endX = W - 160;
        const chartY = 480;
        ctx.strokeStyle = '#76b900';
        ctx.lineWidth = 6;
        ctx.beginPath();
        const steps = 30;
        const drawSteps = Math.floor(steps * easeOutCubic(p));
        for (let i = 0; i <= drawSteps; i++) {
          const x = startX + (i / steps) * (endX - startX);
          const y = chartY - Math.sin(i * 0.4) * 80 - (i / steps) * 160;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }
      // 4. Logo CTA (8~10s)
      else {
        ctx.save();
        ctx.fillStyle = '#f59e0b';
        ctx.font = '900 68px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 35;
        ctx.fillText('오토트레이딩 시스템 가동 승인 ⚡', W / 2, H / 2 - 30);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 34px Pretendard, sans-serif';
        ctx.fillText('이상일 대표님 직속 사령부 자동 매매 가동', W / 2, H / 2 + 50);
        ctx.restore();
      }
    }

    // -------------------------------------------------------------------------
    // 프리셋 3: 아온 우주뮤비 (9:16)
    // -------------------------------------------------------------------------
    function renderAonMv(t, W, H) {
      // 우주 별빛 파티클
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      for (let i = 0; i < 40; i++) {
        const x = (i * 137.5) % W;
        const y = ((i * 293.3) + t * 40) % H;
        ctx.fillRect(x, y, 3, 3);
      }

      // 우주복 아온이 캐릭터 (원형 헬멧 & 바이저)
      const jumpY = Math.sin(t * 4) * 35;
      const aonX = W / 2;
      const aonY = H / 2 - 50 + jumpY;

      ctx.save();
      // 헬멧 오라
      ctx.shadowColor = 'rgba(6, 182, 212, 0.9)';
      ctx.shadowBlur = 45;
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(aonX, aonY, 90, 0, Math.PI * 2);
      ctx.fill();

      // 바이저
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(aonX, aonY, 65, 45, 0, 0, Math.PI * 2);
      ctx.fill();

      // 반짝이는 눈
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.arc(aonX - 24, aonY, 12, 0, Math.PI * 2);
      ctx.arc(aonX + 24, aonY, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 16-Band 오디오 스펙트럼
      const bands = 16;
      const barW = 40;
      const totalW = bands * (barW + 12);
      const startX = (W - totalW) / 2;
      const specY = H - 280;

      for (let i = 0; i < bands; i++) {
        const freq = Math.sin(t * 8 + i * 0.7) * 0.5 + 0.5;
        const h = 40 + freq * 180;
        ctx.fillStyle = `hsl(${180 + i * 10}, 90%, 60%)`;
        ctx.shadowColor = `hsl(${180 + i * 10}, 90%, 60%)`;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.roundRect(startX + i * (barW + 12), specY - h, barW, h, 8);
        ctx.fill();
      }

      // 텍스트
      ctx.fillStyle = '#fff';
      ctx.font = '800 48px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('우주복 아온이 비트싱크 MV 🪐', W / 2, H / 2 + 200);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 32px Pretendard, sans-serif';
      ctx.fillText('이해상 디자이너 x 클로드 오퍼스 5.5 콜라보', W / 2, H / 2 + 260);
    }

    // =========================================================================
    // 재생 컨트롤
    // =========================================================================
    function togglePlay() {
      if (isPlaying) {
        pausePlay();
      } else {
        startPlay();
      }
    }

    function startPlay() {
      isPlaying = true;
      btnPlay.textContent = '⏸ 일시정지';
      lastTimestamp = performance.now();
      animLoop(lastTimestamp);
    }

    function pausePlay() {
      isPlaying = false;
      btnPlay.textContent = '▶ 재생';
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    }

    function resetPlay() {
      pausePlay();
      seek(0);
    }

    function animLoop(now) {
      if (!isPlaying) return;
      const dt = (now - lastTimestamp) / 1000.0;
      lastTimestamp = now;

      let nextTime = currentTime + dt;
      if (nextTime >= TOTAL_DURATION) {
        nextTime = 0; // 루프 재생
        if (isRecording) {
          stopRecording(); // 녹화 중이면 1사이클 종료 후 자동 다운로드
        }
      }
      seek(nextTime);
      animFrameId = requestAnimationFrame(animLoop);
    }

    function onSliderChange(val) {
      pausePlay();
      seek(parseFloat(val));
    }

    // =========================================================================
    // 녹화 및 캡처
    // =========================================================================
    function toggleRecord() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const stream = canvas.captureStream(30); // 30 FPS
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `aon_motion_${currentPreset}_${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.textContent = '⏹️ 녹화 종료 & 다운로드';
      btnRecord.classList.add('recording');

      // 처음부터 다시 재생하며 녹화
      seek(0);
      startPlay();
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      btnRecord.textContent = '🔴 WebM 영상 녹화';
      btnRecord.classList.remove('recording');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    function exportFramePNG() {
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `frame_${currentPreset}_${currentTime.toFixed(2)}s.png`;
      a.click();
    }

    // 초기 실행
    seek(0);
  </script>
</body>
</html>
