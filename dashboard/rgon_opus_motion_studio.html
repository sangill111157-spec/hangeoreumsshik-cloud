    function switchPromoTab(tab) {

    // =========================================================================
    // 4단 스토리보드 결정론적 렌더러 (window.seek(t))
    // =========================================================================
    window.seek = function(t) {
      currentTime = clamp(t, 0, TOTAL_DURATION);
      timeSlider.value = currentTime;
      timeDisplay.textContent = `${currentTime.toFixed(2)}s / 10.0s`;

      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = '#0a0e1a';
      ctx.fillRect(0, 0, W, H);

      let phaseText = '';
      if (currentTime < 2.0) phaseText = 'Hook (0~2s): 타이포 임팩트 & 감성 오프닝';
      else if (currentTime < 5.0) phaseText = 'Story (2~5s): 핵심 트랙/맥락 & 멜로디 파형';
      else if (currentTime < 8.0) phaseText = 'Data Count-up (5~8s): D-Day / 실시간 지표 카운트업';
      else phaseText = 'Logo CTA (8~10s): 24개 플랫폼 스트리밍 & 공식 채널 액션';
      phaseOverlay.textContent = phaseText;

      if (currentPreset === 'hangeoreum_album1') renderAlbum1(currentTime, W, H);
      else if (currentPreset === 'hangeoreum_album2') renderAlbum2(currentTime, W, H);
      else if (currentPreset === 'booster_playlist') renderBooster(currentTime, W, H);
      else if (currentPreset === 'cafe_hour') renderCafe(currentTime, W, H);
      else if (currentPreset === 'blogger_health') renderBlogger(currentTime, W, H);
      else if (currentPreset === 'nvda_chart_motion') renderNvda(currentTime, W, H);
      else renderAonMv(currentTime, W, H);
    };

    // -------------------------------------------------------------------------
    // 프리셋 1: 정규 1집 《가을과 겨울 사이》 (16:9)
    // -------------------------------------------------------------------------
    function renderAlbum1(t, W, H) {
      // 가을 새벽 감성 그라데이션 & 낙엽 파티클
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#1a102f');
      grad.addColorStop(1, '#0b1329');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 낙엽 파티클
      ctx.fillStyle = 'rgba(245, 158, 11, 0.4)';
      for (let i = 0; i < 30; i++) {
        const x = (i * 187 + t * 45) % W;
        const y = (i * 93 + t * 25) % H;
        ctx.beginPath();
        ctx.ellipse(x, y, 6, 3, (t + i) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      if (t < 2.0) {
        const p = t / 2.0;
        ctx.save();
        ctx.translate(W / 2, H / 2 - 40);
        ctx.scale(0.8 + easeOutCubic(p) * 0.2, 0.8 + easeOutCubic(p) * 0.2);
        ctx.fillStyle = '#f8fafc';
        ctx.font = '900 76px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(245, 158, 11, 0.8)';
        ctx.shadowBlur = 35;
        ctx.fillText('가을과 겨울 사이', 0, 0);

        ctx.fillStyle = '#f59e0b';
        ctx.font = '600 36px Pretendard, sans-serif';
        ctx.fillText('한걸음씩 정규 1집 (12 Tracks)', 0, 70);
        ctx.restore();
      } else if (t < 5.0) {
        const p = (t - 2.0) / 3.0;
        ctx.save();
        ctx.fillStyle = '#f8fafc';
        ctx.font = '800 48px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('계절의 길목에서 건네는 따뜻한 온기 🌱', W / 2, 160);

        // 12트랙 롤링
        const tracks = ['1.막차', '2.창을 닫지 마', '3.첫 입김', '4.오늘은 여기까지', '5.밥은 먹었니', '6.식어 가는 차', '7.가로등 아래서', '8.남겨 둔 자리', '9.보내지 않은 말', '10.불은 꺼지지 않아', '11.난로 옆에서', '12.내일의 아침'];
        const activeIdx = Math.floor(p * 12);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 28px Pretendard, sans-serif';
        ctx.fillText(tracks.slice(0, 6).join('   ·   '), W / 2, 380);
        ctx.fillText(tracks.slice(6, 12).join('   ·   '), W / 2, 440);

        ctx.fillStyle = '#f59e0b';
        ctx.font = '800 42px Pretendard, sans-serif';
        ctx.fillText(`NOW: ${tracks[activeIdx] || tracks[0]}`, W / 2, 600);
        ctx.restore();
      } else if (t < 8.0) {
        const p = (t - 5.0) / 3.0;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 32px Pretendard, sans-serif';
        ctx.fillText('DistroKid 글로벌 정식 배급 D-Day', W / 2, 280);

        ctx.fillStyle = '#10b981';
        ctx.font = '900 96px Pretendard, sans-serif';
        ctx.shadowColor = 'rgba(16, 185, 129, 0.8)';
        ctx.shadowBlur = 30;
        ctx.fillText('D-10 (2026.11.06)', W / 2, 420);

        ctx.fillStyle = '#06b6d4';
        ctx.font = '700 34px Pretendard, sans-serif';
        ctx.fillText('UPC: 700563848544 | 24개 플랫폼 배급 완료', W / 2, 540);
        ctx.restore();
      } else {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.font = '900 64px Pretendard, sans-serif';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 40;
        ctx.fillText('전 세계 24개 스트리밍 플랫폼에서 만나요', W / 2, H / 2 - 40);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 32px Pretendard, sans-serif';
        ctx.fillText('Spotify · Apple Music · YouTube Music · Melon · Genie', W / 2, H / 2 + 50);
        ctx.restore();
      }
    }

    // -------------------------------------------------------------------------
    // 프리셋 2: 정규 2집 《잔상》 (16:9)

        ctx.shadowColor = '#c084fc';

    // -------------------------------------------------------------------------
    // 프리셋 3: 부스터 플리 & 틱톡 (9:16)
    // -------------------------------------------------------------------------
    function renderBooster(t, W, H) {
      // 사이버펑크 네온 이퀄라이저
      ctx.fillStyle = '#05050f';
      ctx.fillRect(0, 0, W, H);

      // 틱톡 지표 카운트업
      if (t < 2.0) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 78px Pretendard, sans-serif';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 40;
        ctx.fillText('BOOSTER PLAYLIST', W / 2, H / 2 - 60);

        ctx.fillStyle = '#06b6d4';
        ctx.font = '800 42px Pretendard, sans-serif';
        ctx.fillText('⚡ 1시간 Phonk & Workout ⚡', W / 2, H / 2 + 30);
        ctx.restore();
      } else if (t < 5.0) {
        // 비트싱크 오디오 바
        const bands = 14;
        const bW = 55;
        const startX = (W - (bands * (bW + 16))) / 2;
        for (let i = 0; i < bands; i++) {
          const h = 80 + Math.sin(t * 12 + i * 0.8) * 220;
          ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#06b6d4';
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 20;
          ctx.fillRect(startX + i * (bW + 16), H / 2 + 100 - h, bW, h);
        }
        ctx.fillStyle = '#f8fafc';
        ctx.font = '800 52px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('심장 박동수 180BPM 폭발 💥', W / 2, H / 2 - 250);
      } else if (t < 8.0) {
        const p = (t - 5.0) / 3.0;
        const followers = Math.floor(easeOutCubic(p) * 2125);

    // =========================================================================
    // 재생 컨트롤 & 녹화
    // =========================================================================
    function togglePlay() {
      if (isPlaying) pausePlay();
      else startPlay();
    }

    function startPlay() {
      isPlaying = true;
      btnPlay.textContent = '⏸ 일시정지';
      lastTimestamp = performance.now();
      animLoop(lastTimestamp);
    }

    function pausePlay() {
      isPlaying = false;
      btnPlay.textContent = '▶ 재생';
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    }

    function resetPlay() {
      pausePlay();
      seek(0);
    }

    function animLoop(now) {
      if (!isPlaying) return;
      const dt = (now - lastTimestamp) / 1000.0;
      lastTimestamp = now;

      let nextTime = currentTime + dt;
      if (nextTime >= TOTAL_DURATION) {
        nextTime = 0;
        if (isRecording) stopRecording();
      }
      seek(nextTime);
      animFrameId = requestAnimationFrame(animLoop);
    }

    function onSliderChange(val) {
      pausePlay();
      seek(parseFloat(val));
    }

    function toggleRecord() {
      if (isRecording) stopRecording();
      else startRecording();
    }

    function startRecording() {
      recordedChunks = [];
      const stream = canvas.captureStream(30);
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `aon_motion_${currentPreset}_${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.textContent = '⏹️ 녹화 종료 & 다운로드';
      btnRecord.classList.add('recording');
      seek(0);
      startPlay();
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      btnRecord.textContent = '🔴 WebM 영상 녹화';
      btnRecord.classList.remove('recording');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    function exportFramePNG() {
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `frame_${currentPreset}_${currentTime.toFixed(2)}s.png`;
      a.click();
    }

    // 초기화
    updatePromoBox();
    seek(0);
  </script>
