<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 제3부서: 미디어·음원청 | 한걸음씩 청와대 독립 청사</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #070a13; color: #f8fafc; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(236, 72, 153, 0.25); }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-8 space-y-6">

  <!-- 헤더 바 -->
  <div class="glass-card rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-600 via-rose-600 to-amber-600 flex items-center justify-center text-2xl shadow-lg shadow-pink-500/40">
        🎵
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg sm:text-xl font-extrabold text-white">제3부서: 미디어·음원청</h1>
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-pink-500/20 text-pink-300 border border-pink-500/40">
            ● 독립 청사 보호됨 (LOCKED_IMMUTABLE)
          </span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Suno AI 음원 스트리밍 · 432Hz 힐링 주파수 · 노박 라디오극 음성 믹싱 · REA 감성 시사회</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="/?v=800&tab=command" class="px-4 py-2 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs transition flex items-center gap-1.5 shadow-lg shadow-pink-600/30">
        🏛️ 청와대 본관 복귀 ➔
      </a>
    </div>
  </div>

  <!-- 미디어 스튜디오 메인 그리드 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="glass-card rounded-2xl p-5 space-y-4">
      <h2 class="font-bold text-white text-sm flex items-center gap-2">
        <span>🎹</span> Suno AI & 432Hz 힐링 음원 플레이어
      </h2>
      <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
        <div class="text-xs text-slate-400">현재 트랙: <span class="text-pink-300 font-bold">새벽 숲길 명상 (432Hz)</span></div>
        <audio controls class="w-full">
          <source src="/api/audio?path=default" type="audio/mpeg">
          브라우저가 오디오 재생을 지원하지 않습니다.
        </audio>
      </div>
      <button onclick="alert('음원 큐가 동기화되었습니다!')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
        🔄 음원 라이브러리 새로고침
      </button>
    </div>

    <div class="glass-card rounded-2xl p-5 space-y-4">
      <h2 class="font-bold text-white text-sm flex items-center gap-2">
        <span>📻</span> 노박 라디오극 사연 자동 제작 팩토리
      </h2>
      <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2 text-xs text-slate-300">
        <div>• 3.0배 시니어 보이스 볼륨 부스트 엔진 연동</div>
        <div>• Veo 클립 + 자동 자막 렌더링 파이프라인</div>
        <div>• Daily Stoic 3초 후킹 공식 50초 숏츠 자동 제작</div>
      </div>
      <button onclick="alert('노박 라디오 제작 팩토리가 정상 대기 중입니다.')" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-600 to-rose-600 hover:opacity-90 text-white text-xs font-bold transition">
        🎬 라디오극 렌더러 가동
      </button>
    </div>
  </div>

</body>
</html>
