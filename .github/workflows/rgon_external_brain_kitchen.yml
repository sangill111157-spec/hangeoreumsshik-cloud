name: RGON External Brain Kitchen

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "광고 주제"
        required: true
        default: "종이컵"
        type: string
      style:
        description: "광고 스타일"
        required: true
        default: "반전형"
        type: string
      approved:
        description: "이번 외부 TTS·영상 실행을 사전 승인합니다"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rgon-external-brain-kitchen
  cancel-in-progress: false

jobs:
  # >>> RGON-AUTO-EVOLVE-BRAIN v1.0 >>>
  rgon_auto_evolve_brain:
    name: "🧠 RGON Auto-Evolve Brain (TOP1 무인 자가 진단·치유)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node (node --check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          python -m pip install --upgrade pip
          pip install pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 || true
      - name: Restore Google token (optional secret RGON_TOKEN_PICKLE_B64)
        env:
          RGON_TOKEN_PICKLE_B64: ${{ secrets.RGON_TOKEN_PICKLE_B64 }}
        run: |
          if [ -n "$RGON_TOKEN_PICKLE_B64" ]; then echo "$RGON_TOKEN_PICKLE_B64" | base64 -d > token.pickle; fi
      - name: Run Auto-Evolve Brain (CI)
        run: python rgon_auto_evolve_brain.py --ci
      - name: Commit self-heal results
        run: |
          rm -f token.pickle
          git config user.name "rgon-brain-bot"
          git config user.email "rgon-brain-bot@users.noreply.github.com"
          for p in brain_basket ingredients_basket rgon_aside_extension omni_bridge.py rgon_alpha_chat.html omni_dispatch_queue.json evolution_memory.json; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          git reset -q -- brain_basket/backups 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "🧠 RGON Auto-Evolve Brain: nightly self-diagnosis & self-heal"
          git pull --rebase --autostash || true
          git push || echo "push 실패 — 다음 실행 시 재시도"
  # <<< RGON-AUTO-EVOLVE-BRAIN <<<
  kitchen:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.approved == true) ||
      (github.event_name == 'schedule' && vars.RGON_SCHEDULE_APPROVED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TOPIC: ${{ inputs.topic || '종이컵' }}
      STYLE: ${{ inputs.style || '반전형' }}

    steps:
      - name: Checkout approved repository files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check brain before dependency installation
        run: python -B external_kitchen_worker.py --check-brain --topic "$TOPIC" --style "$STYLE"

      - name: Install external media tools and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install "Pillow>=10,<13" "edge-tts>=6,<8"
          if ! python -m pip install "langgraph>=0.2,<2"; then
            echo "::warning::LangGraph installation failed; using bounded state-machine fallback."
          fi

      - name: Execute approved external kitchen
        run: |
          python -B external_kitchen_worker.py \
            --topic "$TOPIC" \
            --style "$STYLE" \
            --approved \
            --output external_kitchen_outputs

      - name: Preserve generated artifacts and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgon-kitchen-${{ github.run_id }}-${{ github.run_attempt }}
          path: external_kitchen_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Write receipt summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipts = sorted(Path("external_kitchen_outputs").glob("*/verification_receipt.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## RGON External Brain Kitchen\n")
              if not receipts:
                  handle.write("No successful media receipt; inspect logs and failure artifacts.\n")
              for path in receipts:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  handle.write(f"- Verified H.264/AAC / 300 frames / 10 seconds / {data['bytes']:,} bytes\n")
          PY
