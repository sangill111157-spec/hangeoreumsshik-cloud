name: HanGeoreumSShik Cloud Automation (한걸음씩 클라우드 무인 자동화)

on:
  # 1. 정기 자동 실행 (UTC 기준 스케줄 설정)
  schedule:
    # 매일 07:00 KST (Report) -> UTC 22:00 (전날)
    - cron: '0 22 * * *'
    # 매일 09:00 KST (Analytics) -> UTC 00:00
    - cron: '0 0 * * *'
    # 매주 일요일 10:00 KST (Strategy) -> UTC 일요일 01:00
    - cron: '0 1 * * 0'

  # 2. 대표님 스마트폰 / 텔레그램 원격 수동 트리거
  workflow_dispatch:
    inputs:
      command:
        description: '실행할 작업을 선택하세요'
        required: true
        default: 'report'
        type: choice
        options:
          - 'report'           # 일일 텔레그램 브리핑 리포트
          - 'analytics'        # 3채널 성과 수집 및 분석
          - 'strategy'         # 주간 전략 분석 수립
          - 'produce_healing'  # 힐링 롱폼 & 쇼츠 렌더링
          - 'all'              # 전체 순차 실행

jobs:
  run-automation:
    name: Execute HanGeoreumSShik Automation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Nanum Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib gspread python-dotenv requests
          fi

      - name: Determine Command
        id: select_cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TARGET_CMD=${{ github.event.inputs.command }}" >> $GITHUB_ENV
          else
            # Cron 스케줄에 따른 자동 분기 (UTC 시간 기준)
            HOUR=$(date -u +%H)
            DOW=$(date -u +%u)
            if [ "$HOUR" = "22" ]; then
              echo "TARGET_CMD=report" >> $GITHUB_ENV
            elif [ "$HOUR" = "00" ]; then
              echo "TARGET_CMD=analytics" >> $GITHUB_ENV
            elif [ "$HOUR" = "01" ] && [ "$DOW" = "7" ]; then
              echo "TARGET_CMD=strategy" >> $GITHUB_ENV
            else
              echo "TARGET_CMD=report" >> $GITHUB_ENV
            fi
          fi

      - name: Execute Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAFE_OUTPUT_DIR: './cloud_output'
        run: |
          echo "🚀 실행 작업: $TARGET_CMD"
          mkdir -p cloud_output
          if [ "$TARGET_CMD" = "produce_healing" ]; then
            echo "🎬 힐링 음악 롱폼(8H) & 쇼츠 렌더링 시작..."
            # 에셋이 준비되어 있을 경우 렌더링 실행 (기본 dry-run 및 제작)
            if [ -f "assets/loop.mp4" ] && [ -f "assets/piano.mp3" ]; then
              python healing_music_producer.py --loop assets/loop.mp4 --piano assets/piano.mp3 --ambient assets/rain.mp3 --outdir ./cloud_output --hours 8
            else
              echo "⚠️ 기본 에셋(assets/) 미감지: 단위 파이프라인 검증 모드로 실행합니다."
              python test_healing_producer.py
            fi
          elif [ -f "automation/scheduler_wrapper.py" ]; then
            python automation/scheduler_wrapper.py "$TARGET_CMD"
          elif [ -f "scheduler_wrapper.py" ]; then
            python scheduler_wrapper.py "$TARGET_CMD"
          else
            echo "ℹ️ 로컬 래퍼 미감지 - 파이프라인 정상 등록 대기 상태"
          fi

      - name: Send Execution Report to Telegram (Control Tower)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          JOB_STATUS="${{ job.status }}"
          if [ "$JOB_STATUS" = "success" ]; then
            python control_tower_bot.py --notify --task "$TARGET_CMD" --status "SUCCESS" --message "GitHub Actions 클라우드 작업이 성공적으로 완료되었습니다."
          else
            python control_tower_bot.py --notify --task "$TARGET_CMD" --status "FAILED" --message "GitHub Actions 클라우드 실행 중 오류가 발생했습니다. 로그를 확인해 주세요."
          fi
