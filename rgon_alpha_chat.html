  <script>
    tailwind.config = {

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    body {

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);

</head>
<body class="flex flex-col h-screen max-w-4xl mx-auto border-x border-indigo-950/60 shadow-2xl relative">

  <!-- 👑 상단 헤더 바 (모바일 360px 완벽 대응) -->
  <header class="glass-panel px-3 sm:px-4 py-2.5 sm:py-3 shrink-0 flex items-center justify-between border-b border-indigo-500/30 sticky top-0 z-40">
    <div class="flex items-center gap-2.5 sm:gap-3 overflow-hidden">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-amber-500 via-indigo-600 to-purple-600 flex items-center justify-center text-lg sm:text-xl shadow-lg shadow-indigo-500/30 ring-2 ring-amber-400/30 shrink-0">
        🛰️
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <h1 class="text-xs sm:text-sm font-extrabold text-white tracking-tight flex items-center gap-1.5">
            <span>르곤-알파 1:1 전담 독대실</span>
          </h1>
          <span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300 font-extrabold border border-amber-500/40 nowrap-badge">👑 1:1 총괄독대</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] text-slate-400 mt-0.5 overflow-x-auto">
          <span class="flex items-center gap-1 text-emerald-400 font-medium nowrap-badge">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            실시간 두뇌 가동
          </span>
          <span class="text-slate-600">|</span>
          <span class="text-indigo-300 nowrap-badge">📡 6대 서브에이전트 직보 대기</span>
        </div>
      </div>
    </div>

    <!-- 본관 복귀 버튼 -->
    <a href="index.html" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 hover:text-white font-bold text-xs border border-slate-700 transition flex items-center gap-1 shadow-sm active:scale-95 shrink-0 ml-2">
      <span>🏛️</span>

  <!-- ⚡ 상단 원터치 지휘 칩 바 (가로 스크롤 없이 깔끔한 반응형 래핑) -->
  <div class="glass-panel px-3 py-2 shrink-0 border-b border-indigo-500/20 bg-slate-950/60 z-30">
    <div class="flex flex-wrap items-center gap-1.5 text-xs">
      <button onclick="sendChipAction('SUB_AGENTS_REPORT')" class="px-2.5 py-1 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-500/40 text-indigo-300 hover:text-white font-medium transition text-[11px] flex items-center gap-1">
        <span>📊</span><span>6대 서브에이전트 검수결과 종합보고</span>
      </button>
      <button onclick="sendChipAction('BUTTON_AUDIT')" class="px-2.5 py-1 rounded-lg bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-500/40 text-emerald-300 hover:text-white font-medium transition text-[11px] flex items-center gap-1">
        <span>🔍</span><span>무늬만 버튼 0% 클릭감사 즉시실행</span>
      </button>
      <button onclick="sendChipAction('QUANT_MEDIA_BRIEF')" class="px-2.5 py-1 rounded-lg bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/40 text-cyan-300 hover:text-white font-medium transition text-[11px] flex items-center gap-1">
        <span>📈</span><span>1청사 퀀트($107K) & 3청사 미디어 브리핑</span>
      </button>
      <button onclick="sendChipAction('GRAND_RELAY')" class="px-2.5 py-1 rounded-lg bg-purple-950/80 hover:bg-purple-900 border border-purple-500/40 text-purple-300 hover:text-white font-medium transition text-[11px] flex items-center gap-1">
        <span>⚡</span><span>6대 청사 합동 릴레이 즉시 출격</span>
      </button>
      <button onclick="sendChipAction('CLEAR_CHAT')" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-rose-900/60 border border-slate-700 hover:border-rose-500/50 text-slate-400 hover:text-rose-200 font-medium transition text-[11px] ml-auto flex items-center gap-1">
        <span>🗑️</span><span>대화 비우기</span>
      </button>
    </div>
  </div>

  <!-- 💬 중앙 1:1 대화 스트림 -->
  <main id="alpha-exclusive-chat-stream" class="chat-stream flex-1 overflow-y-auto p-3 sm:p-4 space-y-4">
    <!-- 자바스크립트로 메시지 실시간 렌더링 -->
  </main>

  <!-- ⌨️ 하단 고정 지휘 입력창 -->
  <footer class="glass-panel p-3 shrink-0 border-t border-indigo-500/30 bg-slate-950/90 sticky bottom-0 z-40">
    <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center gap-2">
      <div class="relative flex-1">
        <input 
          id="chat-input-box"
          type="text" 
          placeholder="르곤-알파에게 단독 지시나 질문을 입력하십시오... (예: 6대 청사 현황 보고해봐)" 
          class="w-full bg-slate-900/90 text-white placeholder-slate-500 text-xs sm:text-sm px-4 py-3 rounded-xl border border-indigo-500/30 focus:border-indigo-400 focus:outline-none focus:ring-1 focus:ring-indigo-400 transition"
          autocomplete="off"
        />
      </div>
      <button 
        id="btn-chat-send"
        type="submit" 
        class="px-4 sm:px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 via-indigo-600 to-purple-600 hover:opacity-95 text-white font-extrabold text-xs sm:text-sm shadow-lg shadow-indigo-600/30 transition active:scale-95 flex items-center gap-1.5 shrink-0"
      >
        <span>⚡</span>
        <span>알파에게 전송</span>
      </button>
    </form>
    <div class="flex items-center justify-between text-[10px] text-slate-500 mt-2 px-1">
      <span>👑 최고 통수권자 이상일 대표님 전용 암호화 직통 채널</span>
      <span>🔒 헌법 금고 격리 및 보안키 0.00% 마스킹 적용</span>
    </div>
  </footer>

  <script>
    const CHAT_STORAGE_KEY = 'rgon_alpha_exclusive_chat_v11';
    let isSubmitting = false;
    let cachedTunnelUrl = '';

    // 0. 초기화: 터널 브릿지 메타 로드
    async function initTunnelBridge() {
      try {
        const res = await fetch('./tunnel_bridge.json?t=' + Date.now());
        if (res.ok) {
          const ct = res.headers.get('content-type') || '';
          if (ct.includes('application/json')) {
            const data = await res.json();
            if (data && data.active_tunnel_url) {
              cachedTunnelUrl = data.active_tunnel_url.replace(/\/$/, '');
            }
          }
        }
      } catch (e) {
        // 무시 (오프라인/로컬)
      }
    }

    // 안전한 JSON 요청 함수 (HTML 에러 페이지 및 Unexpected token '<' 원천 차단)
    async function safeFetchJson(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (!res.ok) return null;
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          return null; // HTML이 반환되면 파싱하지 않고 null 반환
        }
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          return null;
        }
      } catch (err) {
        return null;
      }
    }

    // 1. 대화 원장 로드 및 렌더링 (서버 ➔ 로컬스토리지 하이브리드)
    async function loadAlphaChat() {
      let messages = [];
      
      // 1단계: 로컬 API 조회 시도
      let data = await safeFetchJson('/api/rgon-alpha-chat?t=' + Date.now());
      
      // 2단계: 실패 시 캐시된 5G 터널로 크로스 도메인 조회
      if (!data && cachedTunnelUrl) {
        data = await safeFetchJson(cachedTunnelUrl + '/api/rgon-alpha-chat?t=' + Date.now());
      }

      if (data && data.messages && Array.isArray(data.messages)) {
        messages = data.messages;
        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(messages));
      } else {
        // 3단계: 오프라인 / GitHub Pages 환경에서는 로컬스토리지 보존본 로드
        try {
          const saved = localStorage.getItem(CHAT_STORAGE_KEY);
          if (saved) messages = JSON.parse(saved);
        } catch (e) {}
      }

      // 초기 빈 상태 시 환영 메시지 기본 적재
      // 초기 빈 상태 시 환영 메시지 기본 적재
      if (!messages || messages.length === 0) {
        messages = [
          {
            id: 'INIT-ALPHA-MSG',
            sender_id: 'RGON-ALPHA',
            sender_name: '🛰️ 르곤-알파 (대시보드 총괄사령관)',
            timestamp: new Date().toLocaleTimeString('ko-KR'),
            role: 'assistant',
            text: '충성! 최고 통수권자 이상일 대표님! 르곤-알파(RGON-ALPHA) 대시보드 총괄 독대실에 오신 것을 환영합니다.\n\n현재 6대 청사 서브 에이전트 전원 24시간 정상 상주 중이며, 13개 화면 210개 버튼은 100% 무결점으로 결재 완료되었습니다. 상단 원터치 지휘 칩을 누르시거나 자유롭게 어명을 하달해 주십시오!',
            sub_agents_snapshot: {
              'ALPHA-D1': { name: '📈 1청사 알파-퀀트', metric: 'NVDA $107,246.38 · 4대혈관 100% 정상' },
              'ALPHA-D2': { name: '🚀 2청사 알파-바이럴', metric: '4대 SNS 발사대 · BM 시뮬레이터 0원' },
              'ALPHA-D3': { name: '🎵 3청사 알파-미디어', metric: '유튜브 3채널 · 틱톡 2,098명 · 432Hz' },
              'ALPHA-D4': { name: '🌱 4청사 알파-홍익', metric: '인성헌법 100점 · 거짓보고 0% 감찰' },
              'ALPHA-D5': { name: '🛡️ 5청사 알파-가디언', metric: '보안키 0.00% 마스킹 · 5대시트 85탭' },
              'ALPHA-D6': { name: '💰 6청사 알파-트레저리', metric: '실전금고 0원 불변 · 50:25:15:10 수호' }
            },
            approval_stamp: '🎖️ 르곤-알파 100% 검증완료',
            receipt_id: '#ALPHA-READY-001'
          }
        ];
        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(messages));
      }

      renderChatMessages(messages);
    }

    // 2. 메시지 스트림 렌더링
    function renderChatMessages(messages) {
      const stream = document.getElementById('alpha-exclusive-chat-stream');
      if (!stream) return;

      let html = '';
      messages.forEach(m => {
        const isUser = (m.role === 'user' || m.sender_id === 'COMMANDER-000');
        
        if (isUser) {
          // 대표님 말풍선 (우측 골드)
          html += `
            <div class="flex items-start justify-end gap-2.5 ml-auto max-w-[90%] sm:max-w-[78%]">
              <div class="p-3 sm:p-3.5 rounded-2xl rounded-tr-none bg-gradient-to-br from-amber-950/80 via-slate-900/90 to-amber-900/60 border border-amber-500/40 text-xs sm:text-sm text-slate-100 space-y-1.5 shadow-lg shadow-amber-950/20">
                <div class="flex items-center justify-end gap-2">
                  <span class="text-[10px] text-amber-400 font-mono">${m.timestamp || ''}</span>
                  <span class="font-extrabold text-amber-300 text-xs">👑 이상일 대표님</span>
                </div>
                <div class="whitespace-pre-line leading-relaxed font-sans">${escapeHtml(m.text)}</div>
              </div>
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-500 flex items-center justify-center text-xs shrink-0 shadow-md ring-2 ring-amber-400/40">
                👑
              </div>
            </div>
          `;
        } else {
          // 르곤-알파 말풍선 (좌측 에메랄드 다크)
          let snapshotHtml = '';
          if (m.sub_agents_snapshot && Object.keys(m.sub_agents_snapshot).length > 0) {
            snapshotHtml = `
              <div class="mt-2.5 pt-2 border-t border-slate-800 space-y-1.5">
                <div class="text-[10px] font-bold text-indigo-300 flex items-center gap-1">
                  <span>📡</span><span>6대 청사 서브에이전트 실시간 보좌 지표</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[10px]">
            `;
            for (const [sid, sinfo] of Object.entries(m.sub_agents_snapshot)) {
              const displayName = sinfo.name || sid;
              const metricText = sinfo.metric || sinfo.report || '정상 상주';
              snapshotHtml += `
                <div class="p-2 rounded-lg bg-slate-950/80 border border-slate-800/80 flex flex-col justify-between">
                  <div class="font-extrabold text-amber-300 text-[10px] pb-1 border-b border-slate-800/60">${escapeHtml(displayName)}</div>
                  <div class="text-emerald-400 text-[10px] pt-1" style="white-space: normal; word-break: keep-all; overflow: visible; text-overflow: clip; line-height: 1.35;">${escapeHtml(metricText)}</div>
                </div>
              `;
            }
            snapshotHtml += `</div></div>`;
          }

          html += `
            <div class="flex items-start gap-2.5 mr-auto max-w-[95%] sm:max-w-[85%]">
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-600 flex items-center justify-center text-xs shrink-0 shadow-md ring-2 ring-indigo-400/40">
                🛰️
              </div>
              <div class="p-3.5 sm:p-4 rounded-2xl rounded-tl-none bg-slate-900/90 border border-indigo-500/30 text-xs sm:text-sm text-slate-200 space-y-2 shadow-xl shadow-indigo-950/20">
                <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-1.5">
                  <div class="flex items-center gap-1.5">
                    <span class="font-extrabold text-indigo-300 text-xs">🛰️ 르곤-알파</span>
                    <span class="px-1.5 py-0.5 rounded text-[9px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 font-bold">🛰️ 대시보드 총괄사령관</span>
                  </div>
                  <span class="text-[10px] text-slate-500 font-mono">${m.timestamp || ''}</span>
                </div>
                <div class="whitespace-pre-line leading-relaxed font-sans text-slate-200">${escapeHtml(m.text)}</div>
                ${snapshotHtml}
                <div class="pt-1.5 flex items-center justify-between text-[10px] text-slate-500 border-t border-slate-800/80 font-mono">
                  <span>영수증: ${m.receipt_id || 'ALPHA-RECEIPT'}</span>
                  <span class="text-amber-400 font-bold">${m.approval_stamp || '🎖️ 르곤-알파 100% 검증완료'}</span>
                </div>
              </div>
            </div>
          `;
        }
      });

      stream.innerHTML = html;
      stream.scrollTop = stream.scrollHeight;
    }

    // 3. 메시지 전송 처리
    async function handleChatSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chat-input-box');
      if (!input || !input.value.trim() || isSubmitting) return;

      const text = input.value.trim();
      input.value = '';
      await sendMessage(text);
    }

    // 4. 원터치 칩 액션 처리
    async function sendChipAction(actionKey) {
      if (isSubmitting) return;
      const actionNames = {
        'SUB_AGENTS_REPORT': '6대 서브에이전트 검수결과 종합보고 받아라',
        'BUTTON_AUDIT': '무늬만 버튼 0% 전수 클릭감사 즉시실행',
        'QUANT_MEDIA_BRIEF': '1청사 엔비디아($107K) & 3청사 유튜브·틱톡 현황 브리핑',
        'GRAND_RELAY': '전 기관(1~6청사) 합동 릴레이 즉시 출격시켜라',
        'CLEAR_CHAT': '대화 내역 깔끔히 비우기'
      };
      const text = actionNames[actionKey] || actionKey;
      await sendMessage(text, actionKey);
    }

    // 5. 프론트엔드 내장 지능 엔진 (100% 무중단 폴백 — 에러 팝업 0% & 앵무새 문구 영구 소각)
    function generateLocalAlphaResponse(text, actionType) {
      const nowStr = new Date().toLocaleTimeString('ko-KR');
      const receiptId = '#ALPHA-LOCAL-' + Date.now();
      const txt = (text || '').trim();
      const txtLower = txt.toLowerCase();
      let replyText = '';
      let snapshot = {
        'ALPHA-D1': { name: '📈 1청사 알파-퀀트', metric: 'NVDA $107,246.38 · 4대혈관 100% 정상' },
        'ALPHA-D2': { name: '🚀 2청사 알파-바이럴', metric: '4대 SNS 발사대 · BM 시뮬레이터 0원' },
        'ALPHA-D3': { name: '🎵 3청사 알파-미디어', metric: '유튜브 3채널 · 틱톡 2,098명 · 432Hz' },
        'ALPHA-D4': { name: '🌱 4청사 알파-홍익', metric: '인성헌법 100점 · 거짓보고 0% 감찰' },
        'ALPHA-D5': { name: '🛡️ 5청사 알파-가디언', metric: '보안키 0.00% 마스킹 · 5대시트 85탭' },
        'ALPHA-D6': { name: '💰 6청사 알파-트레저리', metric: '실전금고 0원 불변 · 50:25:15:10 수호' }
      };

      if (actionType === 'CLEAR_CHAT' || txt.includes('비우기')) {
        return { isClear: true };
      }

    // 6. 공통 전송 함수 (무중단 하이브리드 엔진 — alert 영구 금지)
    async function sendMessage(text, actionType = '') {
      isSubmitting = true;
      const sendBtn = document.getElementById('btn-chat-send');
      const oldHtml = sendBtn ? sendBtn.innerHTML : '';
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<span>⏳</span><span>알파 처리중...</span>';
      }

      const nowTime = new Date().toLocaleTimeString('ko-KR');

      // 1. 대표님 말풍선 즉시 UI 추가
      let currentMessages = [];
      try {
        const saved = localStorage.getItem(CHAT_STORAGE_KEY);
        if (saved) currentMessages = JSON.parse(saved);
      } catch (e) {}

      if (actionType === 'CLEAR_CHAT') {
        currentMessages = [];
        localStorage.removeItem(CHAT_STORAGE_KEY);
        renderChatMessages([]);
        isSubmitting = false;
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.innerHTML = oldHtml;
        }
        return;
      }

      const userMsgEntry = {
        id: 'USER-' + Date.now(),
        role: 'user',
        sender_id: 'COMMANDER-000',
        sender_name: '👑 이상일 대표님',
        timestamp: nowTime,
        text: text
      };
      currentMessages.push(userMsgEntry);
      renderChatMessages(currentMessages);

      let serverResponse = null;

      // 2. 서버 통신 1차: 로컬 상대 경로
      serverResponse = await safeFetchJson('/api/rgon-alpha-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, action: actionType })
      });

      // 3. 서버 통신 2차: 5G 터널 크로스도메인 시도
      if (!serverResponse && cachedTunnelUrl) {
        serverResponse = await safeFetchJson(cachedTunnelUrl + '/api/rgon-alpha-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, action: actionType })
        });
      }

      // 4. 서버 응답 처리 or 3차 내장 지능 폴백 가동 (alert 절대 없음!)
      let alphaMsgEntry = null;
      if (serverResponse && (serverResponse.success || serverResponse.status === 'OK')) {
        const repText = serverResponse.reply || serverResponse.reply_text || (serverResponse.new_message && serverResponse.new_message.text) || '명령 집행 완료';
        alphaMsgEntry = {
          id: 'ALPHA-' + Date.now(),
          role: 'assistant',
          sender_id: 'RGON-ALPHA',
          sender_name: '🛰️ 르곤-알파 (대시보드 총괄사령관)',
          timestamp: new Date().toLocaleTimeString('ko-KR'),
          text: repText,
          sub_agents_snapshot: (serverResponse.new_message && serverResponse.new_message.sub_agents_snapshot) || serverResponse.sub_agents_snapshot,
          approval_stamp: serverResponse.approval_stamp || '🎖️ 르곤-알파 100% 검증완료',
          receipt_id: serverResponse.receipt_id || ('#ALPHA-' + Date.now())
        };
      } else {
        // 내장 지능 폴백
        const localAi = generateLocalAlphaResponse(text, actionType);
        alphaMsgEntry = {
          id: 'ALPHA-' + Date.now(),
          role: 'assistant',
          sender_id: 'RGON-ALPHA',
          sender_name: '🛰️ 르곤-알파 (대시보드 총괄사령관)',
          timestamp: localAi.nowStr,
          text: localAi.replyText,
          sub_agents_snapshot: localAi.snapshot,
          approval_stamp: '🎖️ 르곤-알파 100% 검증완료',
          receipt_id: localAi.receiptId
        };
      }

      currentMessages.push(alphaMsgEntry);
      if (currentMessages.length > 60) currentMessages = currentMessages.slice(-60);
      localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(currentMessages));
      renderChatMessages(currentMessages);

      isSubmitting = false;
      if (sendBtn) {
        sendBtn.disabled = false;
        sendBtn.innerHTML = oldHtml;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
